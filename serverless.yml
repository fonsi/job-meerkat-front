service: jobmeerkat-web

frameworkVersion: '4'

# HTML origin for /jobpost/{slug} and /blog. CloudFront wiring is manual:
# docs/cloudfront-jobpost.md and docs/cloudfront-blog.md. Deploy prints the Function URL.

provider:
    name: aws
    runtime: nodejs24.x
    region: ${env:AWS_REGION, 'eu-west-1'}
    memorySize: 1024
    timeout: 30
    environment:
        STAGE: ${sls:stage}
        NEXT_PUBLIC_API_ENDPOINT: ${env:NEXT_PUBLIC_API_ENDPOINT}
        NEXT_PUBLIC_SITE_URL: ${env:NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_APP_ENV: ${env:NEXT_PUBLIC_APP_ENV}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${env:NEXT_PUBLIC_GA_MEASUREMENT_ID, ''}
        NEXT_PUBLIC_ADSENSE_ID: ${env:NEXT_PUBLIC_ADSENSE_ID, ''}
        UMAMI_ID: ${env:UMAMI_ID, ''}
        JOB_POST_CACHE_BUCKET: ${sls:stage}-job-post-cache
        BLOG_CACHE_BUCKET: ${sls:stage}-blog-cache
    iamRoleStatements:
        - Effect: Allow
          Action:
              - s3:GetObject
          Resource:
              - arn:aws:s3:::${sls:stage}-job-post-cache/jobpost/*
              - arn:aws:s3:::${sls:stage}-blog-cache/*
        # Without s3:ListBucket, S3 answers GetObject on a missing key with
        # 403 AccessDenied instead of 404 NoSuchKey, so unknown or archived
        # slugs surfaced as 500s. With it, missing keys map to a 404 page.
        - Effect: Allow
          Action:
              - s3:ListBucket
          Resource:
              - arn:aws:s3:::${sls:stage}-job-post-cache
              - arn:aws:s3:::${sls:stage}-blog-cache

build:
    esbuild:
        bundle: true
        minify: false
        sourcemap: false
        format: esm
        configFile: ./esbuild.ssr.mjs

functions:
    jobPostPage:
        handler: src/ssr/htmlPageHandler.handler
        description: SSR HTML for /jobpost/{slug} and /blog
        url: true
